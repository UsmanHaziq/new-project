
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px;
        }

        nav {
            background: #2563eb;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            margin: 60px auto;
            padding: 30px;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            color: #172554;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

        footer {
            background: #172554;
            color: white;
            padding: 15px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Mini Website</h1>
        <p>Welcome to My First Web Page</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="container" id="home">
        <h2>Hello, World!</h2>
        <p>
            Welcome to my mini website.
            I am learning HTML and CSS to create
            beautiful and responsive websites.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </div>

    <footer>
        <p>© 2026 My Mini Website | All Rights Reserved</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Congratulations! Your website is working!";
        }
    </script>

</body>
</html>
